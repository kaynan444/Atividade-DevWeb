<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tech Experience 2026 | Inscrição nas oficinas</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="brand">Tech Experience 2026</p>
      <h1>Inscrição nas oficinas técnicas</h1>
      <p class="lead">Escolha as oficinas que mais interessam a você e garanta sua vaga no evento.</p>
    </div>
  </header>

  <main class="container">
    <form id="form-inscricao" class="card" action="processar.php" method="post">

      <div class="field">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" required minlength="3" autocomplete="name">
      </div>

      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>

      <div class="field">
        <label for="experiencia">Nível de experiência</label>
        <select id="experiencia" name="experiencia" required>
          <option value="">Selecione</option>
          <option value="iniciante">Iniciante</option>
          <option value="intermediario">Intermediário</option>
          <option value="avancado">Avançado</option>
        </select>
      </div>

      <fieldset class="field">
        <legend>Turno de preferência</legend>
        <div class="options">
          <label class="option" for="turno-manha">
            <input type="radio" id="turno-manha" name="turno" value="manha" required>
            Manhã
          </label>
          <label class="option" for="turno-noite">
            <input type="radio" id="turno-noite" name="turno" value="noite">
            Noite
          </label>
        </div>
      </fieldset>

      <fieldset class="field" id="grupo-oficinas">
        <legend>Oficinas de interesse</legend>
        <div class="options">
          <label class="option" for="of-html">
            <input type="checkbox" id="of-html" name="oficinas[]" value="html_css">
            HTML e CSS
          </label>
          <label class="option" for="of-js">
            <input type="checkbox" id="of-js" name="oficinas[]" value="js_dom">
            JavaScript e DOM
          </label>
          <label class="option" for="of-php">
            <input type="checkbox" id="of-php" name="oficinas[]" value="php_backend">
            PHP e Back-end
          </label>
        </div>
        <p class="error-message" id="erro-oficinas" role="alert" hidden></p>
      </fieldset>

      <div class="field">
        <label for="mensagem">Mensagem / motivação</label>
        <textarea id="mensagem" name="mensagem" maxlength="200" rows="4"></textarea>
        <p class="counter" id="contador" aria-live="polite">Restam 200 caracteres</p>
      </div>

      <button type="submit" class="btn">Enviar inscrição</button>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Tech Experience 2026 · Evento acadêmico de tecnologia</p>
    </div>
  </footer>
</body>
</html>
